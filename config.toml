vote_pledge_url = "https://grid.utaw.tech/nc/form/0affe0d8-0d1c-41be-a7b6-0e42ddd5ca56"
# Contact address shown in the footer and in demand texts. In data/demands.toml
# write {contact_email} where it should appear; it's swapped in at build time.
contact_email = "alphabet@utaw.tech"

[markdown]
external_links_target_blank = true   # external links only
