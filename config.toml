base_url = "https://www.gdmunion.co.uk"
title = "UTAW at DeepMind"
description = "Google DeepMind UK employees are unionising for enforceable red lines on AI, transparency over military and surveillance contracts, and a real environmental commitment. Join us."
default_language = "en"
minify_html = true
generate_feeds = false
# No sitemap: the site carries noindex on every page and we do not want it
# listed in search results, so there is nothing to advertise to crawlers.
