# FAQ entries shown in the FAQ section.
# Add one by copying a [[faq]] block. Answers support Markdown.
# Each entry's `topic` must be one of `topics`, which also sets the order the
# groups appear in. The first half of the topics fill the left column, the
# rest the right column.
# An optional `id` gives the question a stable link, #faq-<id> (How to Join,
# the timeline and Our Demands link to these); following such a link opens
# the answer.

topics = ["Joining", "Recognition", "Bargaining & demands", "General"]

[[faq]]
question = "Can I stay anonymous?"
topic = "Joining"
id = "anonymous"
answer = """
Yes.

Your employer does not have a legal right to know if you are a member of a trade union. Unions keep
their membership lists strictly confidential. Under Data Protection (UK GDPR), trade union membership
is classified as "special category data", meaning it requires the highest level of privacy protection.

If the union pursues statutory recognition through the UK Government's Central Arbitration Committee
(CAC), the CAC will need to verify the union has sufficient membership within the bargaining unit —
typically at least 10% of workers. To do this, membership data may need to be submitted to the CAC,
which is an independent governmental body.

Critically, this data is not shared with Google. The CAC handles it confidentially, and the employer
only sees the membership percentage.

The law forbids employers from compiling lists of union members — see Blacklisting Regulations 2010,
Reg. 3.
"""

[[faq]]
question = "Who can join?"
topic = "Joining"
id = "who-can-join"
answer = """
Membership is open to all UK employees of Google, including TVC. This specific recognition campaign, however,
only covers Google DeepMind FTEs. We encourage people outside of Google DeepMind to join UTAW anyway: we
all work together, and in the future we can try to get recognition in other bargaining units.

Unfortunately, colleagues based outside the UK (for example in the US) aren't
eligible.
There are other options:
- Join the [Coalition of Concerned AI Staff](https://concernedaistaff.org/), an international, inter-lab effort sharing growing concerns about how AI is being developed and used in the real world, with a focus on military and surveillance applications.
- Join an international coalition of Google DeepMind employees: [AIOC](https://www.aioc.sbs/interest).
- Join [No Tech for Apartheid](https://www.notechforapartheid.com/), a worker-led labour organisation of Google workers organising to hold Google accountable for creating positive impact in the world and challenging complicity in militarism and surveillance.
- US colleagues can organise with our sister union, the [Alphabet Workers Union (AWU)](https://www.alphabetworkersunion.org/).
"""

[[faq]]
question = "How much does it cost, and what do I get?"
topic = "Joining"
id = "cost"
answer = """
Membership is **£8.70 a month**, much lower than many unions (Alphabet Workers Union
members, for example, pay 1% of total compensation). This covers the cost of running the
union — trained organisers, legal advice, and support when you need it.

In return you get:

- Access to our **free legal helpline and advice from day one**, and **training** on your rights.
- **Individual representation** in disciplinary and grievance hearings (for issues arising after your first eight weeks of membership), so it's worth joining before you need it.
- Everyday **member discounts** that alone can more than cover the cost: discounted supermarket vouchers, free cinema tickets, cheaper gym memberships, and savings on holidays, travel, insurance and more.

We follow a one-member, one-vote principle. By joining, you can help shape our demands.
You can also be involved in our talks with policymakers and help give form to AI regulation.
"""

[[faq]]
question = "What legal protection are we entitled to?"
topic = "Joining"
answer = """
- **Protection from dismissal for union activity** — Section 152 TULRCA 1992
- **Protection from detriment** (demotion, pay cut, harassment) for union activity — Section 146 TULRCA 1992
- **Protection from dismissal for taking part in lawful industrial action** (now automatically unfair, no qualifying period) — Section 238A TULRCA, as amended by Employment Rights Act 2025
- **Protection from detriment for industrial action** (coming into force October 2026) — Employment Rights Act 2025, s.76 (which inserts s.236A into TULRCA 1992)
- **Right to paid time off for union representatives** to carry out duties — Section 168 TULRCA 1992
- **Right to unpaid time off for all members** to take part in union activities — Section 170 TULRCA 1992
- **Individual representation** in disciplinary and grievance hearings — Employment Relations Act 1999, s.10
- **Legal support through the union** if things go wrong — Union rulebook / membership agreement
- **Democratic voice** in setting demands and balloting on action — Section 226 TULRCA 1992 (ballot provisions)
- **Protection from blacklisting** based on union activities — Blacklisting Regulations 2010
"""

[[faq]]
question = "Why doesn't Google want us to form a union?"
topic = "General"
answer = """
Together we can formally act as an employee-side counterweight to management's ability to exercise
unchecked authority. Management's self-interest is to prevent us from having this kind of power.
"""

[[faq]]
question = "What is union recognition?"
topic = "Recognition"
answer = """
Recognition is what gives your union the legal right to negotiate with the employer on workers'
behalf. Without recognition, the employer can simply ignore your union. With recognition, they are
legally obliged to engage. **By securing union recognition, workers gain formal rights to collective
bargaining, disclosure of internal company information, and mandatory consultation on major
workplace changes.**

When a union applies for recognition, it defines the **bargaining unit**, which is the group of
workers that it seeks to represent. For example, it can be all of Google DeepMind, or a smaller
unit. Recognition can happen in two ways: **voluntary** or **statutory**.

The recognition process ends with a [**recognition agreement**](#faq-recognition-agreement).
"""

[[faq]]
question = "What is voluntary recognition?"
topic = "Recognition"
id = "voluntary"
answer = """
The employer simply agrees to work with the union in the scope defined by the
[recognition agreement](#faq-recognition-agreement). For voluntary recognition to happen, at least 10% of the bargaining unit must be
members, and the majority of members should vote in favour of the recognition. The vote is
internal to the union.

We asked for voluntary recognition on 4 May, but Google refused. Negotiations via ACAS also
failed, so we are now applying for statutory recognition.
"""

[[faq]]
question = "What is statutory recognition?"
topic = "Recognition"
id = "statutory"
answer = """
If an employer refuses to recognise a union, the union can apply to the Central Arbitration
Committee (CAC). The CAC will verify whether a minimum membership threshold is met (10% of the
bargaining unit), and then all employees in the unit are called to vote (ballot). A majority vote in
favour is sufficient for the recognition to happen.

Statutory recognition covers pay, hours and holidays by law; see
[how we can extend it](#faq-scope) to other topics.
"""

[[faq]]
question = "What is a recognition agreement?"
topic = "Recognition"
id = "recognition-agreement"
answer = """
A recognition agreement is a formal document which sets out who is covered by the union (the
bargaining unit), what issues can be negotiated, how bargaining meetings work, what facilities and
time off union representatives are entitled to, and how disputes are resolved if the two sides cannot agree.

It sets the rules for bargaining; what is actually agreed goes into
[collective bargaining agreements](#faq-collective-agreement).

A recognition agreement is not set in stone. It can be expanded, updated, or renegotiated over
time, and doing so is often one of the union's most important long-term goals.
"""

[[faq]]
question = "What happens if recognition fails?"
topic = "Recognition"
answer = """
The union will not be able to apply for statutory recognition in the same or a similar bargaining
unit for three years after a failed process. It can apply after one year in a different bargaining
unit. Voluntary recognition can happen at any time.
"""

[[faq]]
question = "What demands can be discussed at the bargaining table? How can we extend beyond pay / hours / holidays?"
topic = "Bargaining & demands"
id = "scope"
answer = """
Where a union gains recognition through the statutory process, it has the legal right to bargain collectively over pay, hours,
and holiday entitlement. These are the minimum issues covered by the recognition agreement, but **there is no restriction on topics
we can discuss** in collective bargaining — including business practices, company priorities and governance. 
To do so, we need to **pressure Google to extend the [recognition agreement](#faq-recognition-agreement)**. Our industrial leverage includes actions short of a strike,
campaigns, and ultimately strikes if the employer refuses. **The stronger the union, the more effective the pressure**.
Most often, a credible threat is all it takes. Getting recognition is just the first step — then we work on extending the recognition agreement.
"""

[[faq]]
question = "How are demands agreed upon?"
topic = "Bargaining & demands"
id = "demands-agreed"
answer = """
Demands are set through a democratic process: they come from the membership. This is what gives
them legitimacy, both within the union and in the eyes of the employer.

1. **Consultation:** members are asked about their priorities through meetings, surveys, or
   conversations with union representatives. This is where the issues that matter most to workers are identified
   and collected.
2. **Drafting:** union representatives collate the feedback and draft a set of demands that reflects the
   membership's priorities.
3. **Approval:** members vote on or approve the demands before they are formally presented to the
   employer.

After approval, collective bargaining begins. This is where the demands are negotiated with the
employer until a deal is reached.

Collective bargaining is an ongoing process, not a one-off event. New demands can be raised, and
existing ones amended, at any time through the same democratic process.
"""

[[faq]]
question = "What is a collective bargaining agreement?"
topic = "Bargaining & demands"
id = "collective-agreement"
answer = """
A collective bargaining agreement (or collective agreement) is the deal reached between the union
and the employer through bargaining.
The [recognition agreement](#faq-recognition-agreement) defines the topics that can be negotiated.
The union puts forward its demands, and the collective agreement is what is agreed upon after
negotiation.

Bargaining is ongoing, so collective agreements are renegotiated over time: each round can produce
a new or updated one.
"""

[[faq]]
question = "How does a bargaining process end?"
topic = "Bargaining & demands"
id = "bargaining-end"
answer = """
- **A deal is reached:** members need to vote to approve it, and it becomes a
  [collective bargaining agreement](#faq-collective-agreement). They can also reject it and instruct
  union representatives to return to the table.
- **A deal is not reached:** members can be balloted on whether to escalate, including through
  industrial action.
"""

[[faq]]
question = "I don't want to be affected by decisions made by union members — what can I do?"
topic = "General"
answer = """
Decisions that affect you are already made by a much smaller pool of management executives,
with no visibility or meaningful input from you: you were not consulted on the removal of the
autonomous weapons or mass surveillance pledges from the AI Principles, nor on safety risks from
contracts with significant human rights implications.

Collective decision-making improves democratic power rather than reducing it. We will have a way to demand changes,
and the company will have to consult us before making major decisions. Surveys can be run among
all employees to better understand concerns. You will never be forced to engage with or join a union.
"""

[[faq]]
question = "Have you tried internal channels, for example the UK Googler Forums?"
topic = "General"
answer = """
We have tried to open dialogue through the UK Googler Forums, but leadership declined to discuss
ethical matters through this forum. Other routes — petitions with broad support, letters, questions
at town halls, even [protected disclosures](https://x.com/BlackHC/status/2117910329569202182?s=20) — have also been tried and ignored.

"""

[[faq]]
question = "What is \"union busting\"?"
topic = "General"
answer = """
Let's ask Gemini!

![Gemini's response to "what is union busting?", listing common union-busting tactics](/gemini-unionbusting.png)

The best way to counteract union busting:

- **Resist intimidation** by knowing your rights and UK law. Union activity is well protected in the UK.
- **Diversify your sources** — listen to different narratives and build your own informed opinion. Assume leadership have a bias in their comms about unions.
- **Talk with your colleagues** — learn about their experience and motivations directly from them.
"""
