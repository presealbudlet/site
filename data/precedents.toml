[[precedent]]
headline = "Rolls-Royce employees grounded Pinochet's jets"
text = "In 1974, more than 3,000 employees at the Rolls-Royce factory in Scotland refused to repair Chilean Air Force engines, helping ground Pinochet's air force for four years."
image = "precedents/arms.jpg"
focus = "center 40%"
union = "AUEW · 1974"

[[precedent]]
headline = "Dockworkers refuse to ship arms to wars"
text = "On 30 October 2026, more than 25 unions at 110+ ports in 22 countries struck against arms shipments to wars, including the war in Gaza. Genoa's dockers have refused arms cargo since 2019."
image = "precedents/ports.jpg"
focus = "center 78%"
union = "Dockworkers' unions · 2026"

[[precedent]]
headline = "“Green bans”: builders protect the environment"
text = "In the 1970s, Australian builders from the BLF union sided with local communities, insisting their labour should not be used for harmful purposes or to damage the environment."
image = "precedents/green-bans.jpg"
focus = "center 70%"
union = "NSW BLF · 1971"

[[precedent]]
headline = "Pension fund dumps Israeli bonds over human rights"
text = "In 2024, university staff pressured the USS, the UK's largest private pension fund, into divesting from Israeli bonds over human rights violations."
image = "precedents/divestment.jpg"
focus = "center 70%"
union = "UCU · 2024"

[[precedent]]
headline = "Actors vote 99.6% to refuse AI scans"
text = "In December 2025, UK actors voted 99.6% in favour of refusing AI body scans on set, piling pressure on producers to negotiate real protections."
image = "precedents/ai-performers.jpg"
focus = "center 62%"
union = "Equity · 2025"

[[precedent]]
headline = "No AI cloning without consent"
text = "In 2024, SAG-AFTRA's video-game performers walked off the biggest titles in the industry, forcing studios to guarantee consent and pay before AI could clone a single voice or face."
image = "precedents/games.jpg"
focus = "center 68%"
union = "SAG-AFTRA · 2024"
